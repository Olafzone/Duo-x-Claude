<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Duo - Twój partner w cyfrowej transformacji">
    <title>Duo - Landing Page Preview</title>
    <style>
        /*
         * Duo Landing Page - Standalone Preview Styles
         * Ten plik służy do podglądu strony bez WordPressa
         */

        /* Reset i podstawowe style */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #ffffff;
            line-height: 1.6;
        }

        /* Wideo w tle */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: #1a1a2e; /* Fallback gdy brak wideo */
        }

        .video-background::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
        }

        .video-background video {
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        /* Kontener główny */
        .main-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 60px 40px;
            position: relative;
            z-index: 1;
        }

        /* Logo */
        .logo-container {
            text-align: left;
            margin-bottom: 80px;
        }

        .logo-container img,
        .logo-container svg {
            max-width: 200px;
            height: auto;
        }

        .logo-placeholder {
            font-size: 72px;
            font-weight: 700;
            letter-spacing: 8px;
            text-transform: uppercase;
        }

        /* Sekcja opisu */
        .description-section {
            max-width: 600px;
            margin-left: 20px;
            margin-bottom: 60px;
        }

        .description-section p {
            font-size: 18px;
            font-weight: 300;
            line-height: 1.4;
            letter-spacing: 0.5px;
        }

        /* Formularz leadów */
        .lead-form-section {
            max-width: 400px;
            margin-left: 20px;
        }

        .lead-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group input {
            padding: 20px 24px;
            font-size: 14px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 400;
            letter-spacing: 2px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.8);
            color: #ffffff;
            border-radius: 0;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .form-group input:focus {
            outline: none;
            background: transparent;
            border-color: #ffffff;
        }

        .submit-btn {
            padding: 15px 40px;
            font-size: 16px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .form-message {
            padding: 15px;
            border-radius: 4px;
            display: none;
        }

        .form-message.success {
            background: rgba(76, 175, 80, 0.3);
            border: 1px solid rgba(76, 175, 80, 0.5);
            display: block;
        }

        .form-message.error {
            background: rgba(244, 67, 54, 0.3);
            border: 1px solid rgba(244, 67, 54, 0.5);
            display: block;
        }

        /* Responsywność */
        @media (max-width: 768px) {
            .main-container {
                padding: 40px 20px;
            }

            .logo-container {
                margin-bottom: 50px;
            }

            .logo-placeholder {
                font-size: 48px;
            }

            .description-section {
                margin-left: 0;
                margin-bottom: 40px;
            }

            .description-section p {
                font-size: 16px;
            }

            .lead-form-section {
                margin-left: 0;
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            .logo-placeholder {
                font-size: 36px;
                letter-spacing: 4px;
            }

            .description-section p {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- Wideo w tle -->
    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="assets/video/bg-wideo.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Główna zawartość -->
    <main class="main-container">

        <!-- Logo -->
        <header class="logo-container">
            <!-- Zamień na właściwe logo SVG -->
            <div class="logo-placeholder">DUO</div>
            <!-- lub użyj: <img src="assets/images/logo.svg" alt="Duo" class="logo"> -->
        </header>

        <!-- Opis działalności -->
        <section class="description-section">
            <p>
                Duo to agencja kreatywna specjalizująca się w tworzeniu wyjątkowych doświadczeń cyfrowych.
                Łączymy strategię, design i technologię, aby budować marki, które wyróżniają się na rynku.
                Razem przekształcimy Twoją wizję w rzeczywistość.
            </p>
        </section>

        <!-- Formularz leadów -->
        <section class="lead-form-section">
            <form class="lead-form" id="duo-lead-form">
                <div class="form-group">
                    <input
                        type="text"
                        id="lead-name"
                        name="lead_name"
                        placeholder="IMIĘ"
                        required
                    >
                </div>

                <div class="form-group">
                    <input
                        type="email"
                        id="lead-email"
                        name="lead_email"
                        placeholder="EMAIL"
                        required
                    >
                </div>

                <button type="submit" class="submit-btn">Wyślij</button>

                <div class="form-message" id="form-message"></div>
            </form>
        </section>

    </main>

    <script>
    // Demo obsługi formularza (bez backendu)
    document.getElementById('duo-lead-form').addEventListener('submit', function(e) {
        e.preventDefault();

        const name = document.getElementById('lead-name').value;
        const email = document.getElementById('lead-email').value;
        const messageEl = document.getElementById('form-message');
        const submitBtn = this.querySelector('.submit-btn');

        submitBtn.disabled = true;
        submitBtn.textContent = 'Wysyłanie...';

        // Symulacja wysyłania (w WordPress obsłuży to functions.php)
        setTimeout(() => {
            messageEl.className = 'form-message success';
            messageEl.textContent = 'Dziękujemy! Wkrótce się odezwiemy.';
            messageEl.style.display = 'block';

            this.reset();
            submitBtn.disabled = false;
            submitBtn.textContent = 'Wyślij';

            console.log('Lead zapisany:', { name, email });
        }, 1000);
    });
    </script>

</body>
</html>
