<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Duo - Twój partner w cyfrowej transformacji">
    <title>Duo - Landing Page Preview</title>
    <style>
        /*
         * Duo Landing Page - Standalone Preview Styles
         * Ten plik służy do podglądu strony bez WordPressa
         */

        /* Reset i podstawowe style */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #ffffff;
            line-height: 1.6;
        }

        /* Wideo w tle */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            background: #1a1a2e; /* Fallback gdy brak wideo */
        }

        .video-background::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
        }

        .video-background video {
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        /* Kontener główny */
        .main-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 40px;
            position: relative;
            z-index: 1;
        }

        /* Logo */
        .logo-container {
            text-align: left;
            margin-bottom: 80px;
        }

        .logo-container img,
        .logo-container svg {
            max-width: 200px;
            height: auto;
        }

        /* Sekcja opisu */
        .description-section {
            max-width: 600px;
            margin-left: 0;
            margin-bottom: 30px;
        }

        /* Instagram */
        .instagram-link {
            display: inline-block;
            margin-left: 0;
            margin-bottom: 60px;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .instagram-link:hover {
            opacity: 1;
        }

        .instagram-link svg {
            width: 24px;
            height: 24px;
        }

        .description-section p {
            font-size: 18px;
            font-weight: 300;
            line-height: 1.4;
            letter-spacing: 0.5px;
        }

        /* Formularz leadów */
        .lead-form-section {
            width: 720px;
            margin-top: auto;
            align-self: flex-end;
            margin-right: 0;
        }

        .lead-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group input {
            width: 100%;
            padding: 18px 24px;
            font-size: 15px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 400;
            letter-spacing: 1px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.8);
            color: #ffffff;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
        }

        .form-group input:focus {
            outline: none;
            background: transparent;
            border-color: #ffffff;
        }

        .submit-btn {
            width: 100%;
            padding: 18px 40px;
            font-size: 15px;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-2px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Linia łącząca */
        .connector-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .form-message {
            padding: 15px;
            border-radius: 4px;
            display: none;
        }

        .form-message.success {
            background: rgba(76, 175, 80, 0.3);
            border: 1px solid rgba(76, 175, 80, 0.5);
            display: block;
        }

        .form-message.error {
            background: rgba(244, 67, 54, 0.3);
            border: 1px solid rgba(244, 67, 54, 0.5);
            display: block;
        }

        /* Responsywność */
        @media (max-width: 768px) {
            .main-container {
                padding: 30px 20px;
            }

            .logo-container {
                margin-bottom: 40px;
            }

            .description-section {
                margin-left: 0;
                margin-bottom: 40px;
            }

            .description-section p {
                font-size: 16px;
            }

            .lead-form-section {
                width: 100%;
                align-self: stretch;
                margin-right: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Wideo w tle -->
    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="assets/video/bg-wideo.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Główna zawartość -->
    <main class="main-container">

        <!-- Logo -->
        <header class="logo-container">
            <img src="assets/images/logo.svg" alt="Duo" class="logo">
        </header>

        <!-- Opis działalności -->
        <section class="description-section">
            <p>
                Duo to agencja kreatywna specjalizująca się w tworzeniu wyjątkowych doświadczeń cyfrowych.
                Łączymy strategię, design i technologię, aby budować marki, które wyróżniają się na rynku.
                Razem przekształcimy Twoją wizję w rzeczywistość.
            </p>
        </section>

        <!-- Instagram -->
        <a href="https://instagram.com/duo" target="_blank" rel="noopener noreferrer" class="instagram-link" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="2" width="20" height="20" rx="5" stroke="#ffffff" stroke-width="1.5"/>
                <circle cx="12" cy="12" r="5" stroke="#ffffff" stroke-width="1.5"/>
                <circle cx="17.5" cy="6.5" r="1" fill="#ffffff"/>
            </svg>
        </a>

        <!-- Linia łącząca -->
        <svg class="connector-line" xmlns="http://www.w3.org/2000/svg">
            <line id="connector" stroke="rgba(255,255,255,0.8)" stroke-width="1"/>
        </svg>

        <!-- Formularz leadów -->
        <section class="lead-form-section">
            <form class="lead-form" id="duo-lead-form">
                <div class="form-group">
                    <input
                        type="text"
                        id="lead-name"
                        name="lead_name"
                        placeholder="Imię"
                        required
                    >
                </div>

                <div class="form-group">
                    <input
                        type="email"
                        id="lead-email"
                        name="lead_email"
                        placeholder="Email"
                        required
                    >
                </div>

                <button type="submit" class="submit-btn">Wyślij</button>

                <div class="form-message" id="form-message"></div>
            </form>
        </section>

    </main>

    <script>
    function updateConnector() {
        var container = document.querySelector('.main-container');
        var igLink = document.querySelector('.instagram-link');
        var form = document.querySelector('.lead-form-section');
        var line = document.getElementById('connector');

        if (!container || !igLink || !form || !line) return;

        var cRect = container.getBoundingClientRect();
        var igRect = igLink.getBoundingClientRect();
        var fRect = form.getBoundingClientRect();

        var x1 = igRect.left - cRect.left;
        var y1 = igRect.bottom - cRect.top;
        var x2 = fRect.right - cRect.left;
        var y2 = fRect.top - cRect.top;

        line.setAttribute('x1', x1);
        line.setAttribute('y1', y1);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);
    }

    window.addEventListener('load', updateConnector);
    window.addEventListener('resize', updateConnector);

    // Demo obsługi formularza (bez backendu)
    document.getElementById('duo-lead-form').addEventListener('submit', function(e) {
        e.preventDefault();

        const name = document.getElementById('lead-name').value;
        const email = document.getElementById('lead-email').value;
        const messageEl = document.getElementById('form-message');
        const submitBtn = this.querySelector('.submit-btn');

        submitBtn.disabled = true;
        submitBtn.textContent = 'Wysyłanie...';

        // Symulacja wysyłania (w WordPress obsłuży to functions.php)
        setTimeout(() => {
            messageEl.className = 'form-message success';
            messageEl.textContent = 'Dziękujemy! Wkrótce się odezwiemy.';
            messageEl.style.display = 'block';

            this.reset();
            submitBtn.disabled = false;
            submitBtn.textContent = 'Wyślij';

            console.log('Lead zapisany:', { name, email });
        }, 1000);
    });
    </script>

</body>
</html>
